<!--
  ESTILOS COMPARTIDOS por todas las ventanas de la guía.
  Cada ventana los incluye con un scriptlet que llama a
  incluir_("html/vistas/estilos") (ver html/Conceptos.js).

  Usamos "variables de CSS" (--color-primario, etc.) definidas en :root:
  para cambiar la paleta de TODAS las ventanas, se cambia solo acá.
-->
<style>
  :root {
    --color-primario: #1a73e8;
    --color-primario-oscuro: #1557b0;
    --color-texto: #202124;
    --color-texto-suave: #5f6368;
    --color-borde: #dadce0;
    --color-fondo-suave: #f8f9fa;
    --color-error: #d93025;
    --color-error-fondo: #fce8e6;
    --color-exito: #188038;
    --color-exito-fondo: #e6f4ea;
    --radio: 8px;
  }

  /* box-sizing: border-box hace que el ancho de un elemento incluya su
     relleno y borde (sin esto, un input con width: 100% se "sale"). */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    color: var(--color-texto);
  }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitulo { color: var(--color-texto-suave); margin: 0 0 16px; }

  /* ---------- Campos del formulario ---------- */
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-weight: 600; margin-bottom: 4px; }
  .campo .ayuda { color: var(--color-texto-suave); font-size: 12px; margin-top: 2px; }

  input[type="text"], input[type="email"], input[type="number"], input[type="search"], select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--color-borde);
    border-radius: var(--radio);
    font: inherit;
    background: white;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--color-primario);
    box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
  }

  .casilla { display: flex; align-items: center; gap: 8px; }
  .casilla label { font-weight: normal; margin: 0; }

  /* Campo con error: borde rojo y el mensaje debajo. La clase "con-error"
     la agrega el JavaScript (ver comun.html). */
  .campo.con-error input, .campo.con-error select { border-color: var(--color-error); }
  .campo .mensaje-error { display: none; color: var(--color-error); font-size: 12px; margin-top: 4px; }
  .campo.con-error .mensaje-error { display: block; }

  /* ---------- Botones ---------- */
  .botones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: var(--radio);
    border: 1px solid var(--color-borde);
    background: white;
    color: var(--color-primario);
    cursor: pointer;
  }
  button.primario { background: var(--color-primario); border-color: var(--color-primario); color: white; }
  button.primario:hover { background: var(--color-primario-oscuro); }
  button:disabled { opacity: 0.6; cursor: wait; }

  /* Ruedita de "cargando": un círculo con un borde de otro color que gira. */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: girar 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Avisos (éxito / error) ---------- */
  .aviso { display: none; padding: 10px 12px; border-radius: var(--radio); margin-bottom: 14px; }
  .aviso.visible { display: block; }
  .aviso.error { background: var(--color-error-fondo); color: var(--color-error); }
  .aviso.exito { background: var(--color-exito-fondo); color: var(--color-exito); }
  .aviso a { color: inherit; font-weight: 600; }

  /* ---------- Tarjetas (resultados de búsqueda) ---------- */
  .tarjeta {
    border: 1px solid var(--color-borde);
    border-radius: var(--radio);
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .tarjeta:hover { background: var(--color-fondo-suave); border-color: var(--color-primario); }
  .tarjeta .nombre { font-weight: 600; }
  .tarjeta .detalle { color: var(--color-texto-suave); font-size: 12px; word-break: break-all; }
  .etiqueta { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .etiqueta.activo { background: var(--color-exito-fondo); color: var(--color-exito); }
  .etiqueta.inactivo { background: var(--color-fondo-suave); color: var(--color-texto-suave); }
  .estado { color: var(--color-texto-suave); margin: 10px 0; }
</style>
