<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= incluir_("html/vistas/estilos") ?>
  </head>
  <!--
    TEMPLATE PRECARGADO: el servidor manda el cliente (template.cliente) y
    cada campo arranca con su valor actual, puesto con un scriptlet que
    "escapa" el valor (si el nombre tuviera <script>, se mostraría como
    texto y no se ejecutaría).
  -->
  <body>
    <h1>Editar cliente <?= cliente.id ?></h1>
    <p class="subtitulo">Alta: <?= cliente.fecha_alta ?></p>

    <div id="aviso" class="aviso"></div>

    <form id="formulario" novalidate data-id="<?= cliente.id ?>">
      <div class="campo">
        <label for="nombre">Nombre y apellido</label>
        <input type="text" id="nombre" value="<?= cliente.nombre ?>">
        <div class="mensaje-error"></div>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" value="<?= cliente.email ?>">
        <div class="mensaje-error"></div>
      </div>

      <div class="campo">
        <label for="ciudad">Ciudad</label>
        <!-- El valor actual va en data-valor; el JavaScript lo selecciona. -->
        <select id="ciudad" data-valor="<?= cliente.ciudad ?>">
          <option value="">(sin ciudad)</option>
          <? for (const ciudad of ciudades) { ?>
            <option value="<?= ciudad ?>"><?= ciudad ?></option>
          <? } ?>
        </select>
        <div class="mensaje-error"></div>
      </div>

      <div class="campo">
        <label for="monto">Monto</label>
        <input type="number" id="monto" min="0" step="0.01" value="<?= cliente.monto ?>">
        <div class="mensaje-error"></div>
      </div>

      <div class="campo casilla">
        <input type="checkbox" id="activo" data-valor="<?= cliente.activo ?>">
        <label for="activo">Cliente activo</label>
      </div>

      <div class="botones">
        <button type="button" onclick="google.script.host.close()">Cancelar</button>
        <button type="submit" id="guardar" class="primario">Guardar cambios</button>
      </div>
    </form>

    <?!= incluir_("html/vistas/comun") ?>
    <script>
      const formulario = document.getElementById("formulario");
      const id = formulario.dataset.id;

      // Precargar el desplegable y la casilla desde sus data-valor.
      const ciudad = document.getElementById("ciudad");
      ciudad.value = ciudad.dataset.valor;
      const activo = document.getElementById("activo");
      activo.checked = activo.dataset.valor === "true";

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        ocultarAviso();
        limpiarErrores();

        const cambios = {
          nombre: document.getElementById("nombre").value.trim(),
          email: document.getElementById("email").value.trim(),
          ciudad: ciudad.value,
          // valueAsNumber: NaN si está vacío (ver AltaCliente.html).
          monto: document.getElementById("monto").valueAsNumber,
          activo: activo.checked,
        };
        let ok = true;
        if (cambios.nombre.length < 2) {
          marcarError("nombre", "Escribí el nombre (al menos 2 letras).");
          ok = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cambios.email)) {
          marcarError("email", "Escribí un email válido.");
          ok = false;
        }
        if (!Number.isFinite(cambios.monto) || cambios.monto < 0) {
          marcarError("monto", "El monto tiene que ser un número mayor o igual a 0.");
          ok = false;
        }
        if (!ok) {
          return;
        }

        try {
          const cliente = await conBotonOcupado(document.getElementById("guardar"), "Guardando…", () =>
            llamarServidor("uiActualizarCliente", id, cambios),
          );
          await llamarServidor("uiAvisar", `Cliente ${cliente.id} actualizado`).catch(() => {});
          google.script.host.close();
        } catch (error) {
          mostrarAviso(mensajeDeError(error), "error");
        }
      });
    </script>
  </body>
</html>
