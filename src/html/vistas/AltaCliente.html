<!DOCTYPE html>
<html>
  <head>
    <!-- base target="_top": los links se abren afuera de la ventanita. -->
    <base target="_top">
    <?!= incluir_("html/vistas/estilos") ?>
  </head>
  <!--
    TEMPLATE: los datos que vienen del servidor (template.ciudades,
    template.modo) se usan con "scriptlets" (ver html/Conceptos.js).
    Ojo: dentro de un template, los scriptlets se ejecutan AUNQUE estén
    dentro de un comentario HTML como este: por eso acá no escribimos
    ninguno de ejemplo.
    El "modo" lo guardamos en un atributo data-modo para leerlo desde el
    JavaScript: es más seguro que escribir un scriptlet dentro del <script>.
  -->
  <body data-modo="<?= modo ?>">
    <h1>Nuevo cliente</h1>
    <p class="subtitulo">Se agrega al final de la hoja Clientes.</p>

    <div id="aviso" class="aviso"></div>

    <!-- novalidate: desactiva los avisos automáticos del navegador; los
         mostramos nosotros, con el mismo estilo para todos los errores. -->
    <form id="formulario" novalidate>
      <div class="campo">
        <label for="nombre">Nombre y apellido</label>
        <input type="text" id="nombre" autocomplete="off" autofocus>
        <div class="mensaje-error"></div>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="off">
        <div class="mensaje-error"></div>
      </div>

      <div class="campo">
        <label for="ciudad">Ciudad</label>
        <select id="ciudad">
          <option value="">Elegí una ciudad…</option>
          <!-- Un for dentro del template: arma una opción por ciudad. -->
          <? for (const ciudad of ciudades) { ?>
            <option value="<?= ciudad ?>"><?= ciudad ?></option>
          <? } ?>
        </select>
        <div class="mensaje-error"></div>
      </div>

      <div class="campo">
        <label for="monto">Monto</label>
        <input type="number" id="monto" min="0" step="0.01" value="0">
        <div class="ayuda">En pesos, con hasta 2 decimales.</div>
        <div class="mensaje-error"></div>
      </div>

      <div class="campo casilla">
        <input type="checkbox" id="activo" checked>
        <label for="activo">Cliente activo</label>
      </div>

      <div class="botones">
        <button type="button" id="cancelar">Cancelar</button>
        <button type="submit" id="guardar" class="primario">Guardar</button>
      </div>
    </form>

    <?!= incluir_("html/vistas/comun") ?>
    <script>
      const esModal = document.body.dataset.modo === "modal";
      const formulario = document.getElementById("formulario");

      // En la página web no hay ventana que cerrar: escondemos "Cancelar".
      document.getElementById("cancelar").hidden = !esModal;
      document.getElementById("cancelar").addEventListener("click", () => google.script.host.close());

      /**
       * Validación en el NAVEGADOR: avisa rápido, sin esperar al servidor.
       * Pero NO reemplaza a la del servidor (validarCliente_): cualquiera
       * podría saltearse este JavaScript. La que manda es la del servidor.
       */
      function validar(datos) {
        let ok = true;
        if (datos.nombre.length < 2) {
          marcarError("nombre", "Escribí el nombre (al menos 2 letras).");
          ok = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(datos.email)) {
          marcarError("email", "Escribí un email válido, ej: ana@example.com");
          ok = false;
        }
        if (!datos.ciudad) {
          marcarError("ciudad", "Elegí una ciudad.");
          ok = false;
        }
        if (!Number.isFinite(datos.monto) || datos.monto < 0) {
          marcarError("monto", "El monto tiene que ser un número mayor o igual a 0.");
          ok = false;
        }
        return ok;
      }

      formulario.addEventListener("submit", async (evento) => {
        // preventDefault: que el formulario NO recargue la página (lo que
        // haría un <form> normal). Lo mandamos nosotros con google.script.run.
        evento.preventDefault();
        ocultarAviso();
        limpiarErrores();

        const datos = {
          nombre: document.getElementById("nombre").value.trim(),
          email: document.getElementById("email").value.trim(),
          ciudad: document.getElementById("ciudad").value,
          // Number(): el valor de un input siempre es texto; el servidor
          // espera un número.
          // valueAsNumber da NaN si el campo está vacío o no es un número
          // (Number("") daría 0, y un campo vacío pasaría como monto 0).
          monto: document.getElementById("monto").valueAsNumber,
          activo: document.getElementById("activo").checked,
        };
        if (!validar(datos)) {
          return;
        }

        try {
          const cliente = await conBotonOcupado(document.getElementById("guardar"), "Guardando…", () =>
            llamarServidor("uiGuardarCliente", datos),
          );
          if (esModal) {
            // Avisamos en la planilla y cerramos la ventana. Si el aviso
            // fallara, lo ignoramos: el cliente YA se guardó, y mostrar un
            // error haría que la persona reintente (y duplique el alta).
            await llamarServidor("uiAvisar", `Cliente ${cliente.id} creado: ${cliente.nombre}`).catch(() => {});
            google.script.host.close();
          } else {
            mostrarAviso(`Listo: cliente ${cliente.id} creado.`, "exito");
            formulario.reset();
          }
        } catch (error) {
          // El error que tiró el servidor (por ejemplo, email repetido).
          mostrarAviso(mensajeDeError(error), "error");
        }
      });
    </script>
  </body>
</html>
